<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Software Factory</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%234f46e5'/%3E%3Cpath d='M8 22V12l5 3v-3l5 3v-3l6 4v6z' fill='white'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="styles.css">
  <script>
    // Theme before first paint (per-viewer preference only).
    try { var t = localStorage.getItem('factory.theme'); if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t; } catch (e) {}
  </script>
</head>
<body>
  <div id="root">
    <div class="boot" id="boot">Loading dashboard…</div>
  </div>
  <script>
    // Zero-build loader: prefer vendored copies (factory-cli vendor), fall back
    // to pinned CDN builds, then boot the ES-module app.
    (function () {
      var vendored = false; // set to true by `factory-cli vendor`
      var libs = [
        ['React', 'vendor/react.production.min.js', 'https://cdn.jsdelivr.net/npm/react@18.3.1/umd/react.production.min.js'],
        ['ReactDOM', 'vendor/react-dom.production.min.js', 'https://cdn.jsdelivr.net/npm/react-dom@18.3.1/umd/react-dom.production.min.js'],
        ['htm', 'vendor/htm.umd.js', 'https://cdn.jsdelivr.net/npm/htm@3.1.1/dist/htm.umd.js'],
        ['marked', 'vendor/marked.min.js', 'https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js']
      ];
      function add(src, ok, bad) {
        var s = document.createElement('script');
        s.src = src; s.onload = ok; s.onerror = bad;
        document.head.appendChild(s);
      }
      function fail(name) {
        document.getElementById('boot').innerHTML =
          '<strong>Could not load ' + name + '.</strong><br>Offline? Run <code>node factory/bin/factory-cli.js vendor</code> once to bundle the libraries locally.';
      }
      function next(i) {
        if (i === libs.length) {
          var m = document.createElement('script');
          m.type = 'module'; m.src = 'app.js';
          document.body.appendChild(m);
          return;
        }
        var l = libs[i];
        if (window[l[0]]) return next(i + 1);
        var cdn = function () {
          add(l[2], function () { next(i + 1); }, function () { l[0] === 'marked' ? next(i + 1) : fail(l[0]); });
        };
        if (vendored) add(l[1], function () { next(i + 1); }, cdn); else cdn();
      }
      next(0);
    })();
  </script>
</body>
</html>
